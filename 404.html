<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#071513" />
    <title>Stránka nenalezena | ROSTIVO</title>
    <link rel="icon" type="image/svg+xml" href="/rostivo-favicon-v2.svg?v=20261005" />
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; overflow: hidden; color: #f8f8ef; background: radial-gradient(circle at 78% 12%, rgba(159, 255, 78, .23), transparent 31rem), radial-gradient(circle at 10% 92%, rgba(89, 169, 93, .16), transparent 28rem), #071513; }
      main { width: min(44rem, calc(100% - 2.5rem)); padding: clamp(2rem, 7vw, 5.5rem) 0; text-align: center; }
      .mark { width: 3rem; height: 3rem; display: inline-grid; place-items: center; margin-bottom: 2.1rem; color: #071513; background: #b8ff66; border-radius: 999px; font: 700 1.7rem/1 Georgia, serif; }
      .eyebrow { margin: 0 0 1.2rem; color: #b8ff66; font-size: .72rem; font-weight: 800; letter-spacing: .16em; }
      h1 { max-width: 14ch; margin: 0 auto; font-size: clamp(2.3rem, 8vw, 5.7rem); line-height: .96; letter-spacing: -.07em; }
      p { max-width: 36rem; margin: 1.6rem auto 2.25rem; color: #c8d2ca; font-size: clamp(1rem, 2vw, 1.15rem); line-height: 1.65; }
      a { display: inline-flex; gap: .7rem; align-items: center; justify-content: center; padding: 1rem 1.4rem; color: #071513; background: #b8ff66; border-radius: 999px; text-decoration: none; font-weight: 800; transition: transform .18s ease; }
      a:hover, a:focus-visible { transform: translateY(-2px); outline: 2px solid #fff; outline-offset: 4px; }
      .code { margin-top: 2rem; color: #7f9488; font-size: .8rem; letter-spacing: .14em; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">R</div>
      <p class="eyebrow" id="eyebrow">ROSTIVO / 404</p>
      <h1 id="title">Tato stránka tu není.</h1>
      <p id="text">Možná byla přesunuta, její adresa je překlep nebo už není součástí webu.</p>
      <a id="action" href="/">Zpět na hlavní stránku <span aria-hidden="true">→</span></a>
      <div class="code">404</div>
    </main>
    <script>
      (function () {
        var lang = new URLSearchParams(location.search).get('lang');
        var copy = {
          cs: { eyebrow: 'ROSTIVO / 404', title: 'Tato stránka tu není.', text: 'Možná byla přesunuta, její adresa je překlep nebo už není součástí webu.', action: 'Zpět na hlavní stránku', page: 'Stránka nenalezena | ROSTIVO' },
          en: { eyebrow: 'ROSTIVO / 404', title: 'This page is not here.', text: 'It may have moved, its address may contain a typo, or it is no longer part of the website.', action: 'Back to home', page: 'Page not found | ROSTIVO' },
          uk: { eyebrow: 'ROSTIVO / 404', title: 'Цієї сторінки немає.', text: 'Можливо, її перемістили, в адресі є помилка або вона більше не є частиною сайту.', action: 'На головну сторінку', page: 'Сторінку не знайдено | ROSTIVO' },
          ru: { eyebrow: 'ROSTIVO / 404', title: 'Этой страницы нет.', text: 'Возможно, она была перемещена, в адресе есть опечатка или она больше не является частью сайта.', action: 'На главную страницу', page: 'Страница не найдена | ROSTIVO' }
        };
        var t = copy[lang] || copy.cs;
        document.documentElement.lang = lang || 'cs';
        document.title = t.page;
        document.getElementById('eyebrow').textContent = t.eyebrow;
        document.getElementById('title').textContent = t.title;
        document.getElementById('text').textContent = t.text;
        document.getElementById('action').firstChild.textContent = t.action + ' ';
        document.getElementById('action').href = lang && lang !== 'cs' ? '/?lang=' + lang : '/';
      }());
    </script>
  </body>
</html>
